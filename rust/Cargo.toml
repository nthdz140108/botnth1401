[workspace]
resolver = "2"
members = [
    "crates/mybot-types",
    "crates/zalo-sdk",
    "crates/mybot-storage",
    "crates/mybot-gfx",
    "crates/mybot-media",
    "crates/mybot-core",
    "crates/mybot-services",
    "crates/mybot-commands",
    "crates/mybot-dashboard",
    "bins/mybotd",
    "bins/mybot-ctl",
    "bins/ws-decode-worker",
]

[workspace.package]
version = "4.0.0"
edition = "2024"
rust-version = "1.85"
license = "ISC"

[workspace.dependencies]
# Internal workspace crates
mybot-types = { path = "crates/mybot-types" }
zalo-sdk = { path = "crates/zalo-sdk" }
mybot-storage = { path = "crates/mybot-storage" }
mybot-gfx = { path = "crates/mybot-gfx" }
mybot-media = { path = "crates/mybot-media" }
mybot-core = { path = "crates/mybot-core" }
mybot-services = { path = "crates/mybot-services" }
mybot-commands = { path = "crates/mybot-commands" }
mybot-dashboard = { path = "crates/mybot-dashboard" }

# Async Runtime, Concurrency & High-Speed Allocator
tokio = { version = "1.44", features = ["full", "parking_lot"] }
tokio-util = { version = "0.7", features = ["rt", "codec", "io"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
async-trait = "0.1"
parking_lot = "0.12"
rayon = "1.10"
mimalloc = { version = "0.1", default-features = false }
dashmap = "6.1"
moka = { version = "0.12", features = ["future", "sync"] }
arc-swap = "1.7"
bytes = "1.10"
compact_str = { version = "0.8", features = ["serde"] }

# Networking, TLS (ring-backed for zero-CMake cross-platform builds), WebSocket & Dashboard
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
webpki-roots = "0.26"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls-webpki-roots-no-provider",
    "http2",
    "json",
    "multipart",
    "stream",
    "cookies",
    "socks",
    "gzip",
    "brotli",
    "deflate",
] }
reqwest_cookie_store = "0.8"
cookie = "0.18"
cookie_store = "0.21"
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
url = { version = "2.5", features = ["serde"] }
urlencoding = "2.1"
http = "1.2"
axum = { version = "0.8", features = ["multipart", "ws", "macros"] }
tower = { version = "0.5", features = ["util", "timeout", "limit"] }
tower-http = { version = "0.6", features = ["fs", "cors", "compression-br", "compression-gzip", "trace", "set-header"] }
socketioxide = { version = "0.16", features = ["state", "tracing"] }
rust-embed = { version = "8.5", features = ["interpolate-folder-path"] }
mime_guess = "2.0"

# Cryptography, Hashing & SIMD Compression
aes = "0.8"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
aes-gcm = { version = "0.10", features = ["aes", "alloc"] }
cipher = { version = "0.4", features = ["alloc", "block-padding"] }
typenum = "1.18"
md-5 = "0.10"
hmac = "0.12"
sha2 = "0.10"
subtle = "2.6"
hex = "0.4"
base64 = "0.22"
rand = "0.8"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }

# Serialization, Storage & Text Automata
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
rusqlite = { version = "0.34", features = ["bundled", "backup", "serde_json", "chrono"] }
aho-corasick = "1.1"
regex = "1.11"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
uuid = { version = "1.15", features = ["v4", "fast-rng", "serde"] }
walkdir = "2.5"
dotenvy = "0.15"

# Graphics, Media, AI, QR & Scraping
tiny-skia = "0.11"
ab_glyph = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
imageproc = { version = "0.25", default-features = false }
fast_image_resize = { version = "5.1", features = ["image"] }
gif = "0.13"
qrcode = { version = "0.14", default-features = false, features = ["image"] }
rqrr = "0.9"
scraper = "0.22"
ndarray = "0.16"
skia-safe = { version = "0.82", features = ["textlayout", "svg", "webp"] }
ort = { version = "2.0.0-rc.9", default-features = false, features = ["ndarray", "download-binaries", "std"] }
ocrs = "0.9"
rten = "0.13"

# System, CLI, TUI & Telemetry
libc = "0.2"
nix = { version = "0.29", features = ["process", "signal", "fs"] }
sysinfo = "0.33"
clap = { version = "4.5", features = ["derive", "env"] }
ratatui = "0.29"
crossterm = "0.28"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2.0"
anyhow = "1.0"
tempfile = "3.17"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
panic = "abort"
strip = "symbols"

[profile.bench]
opt-level = 3
lto = "thin"

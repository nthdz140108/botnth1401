[package]
name = "mybot-portal-server"
version.workspace = true
edition.workspace = true

[lib]
name = "mybot_portal_server"

[[bin]]
name = "mybot-portal"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
tokio.workspace = true
uuid.workspace = true
leptos.workspace = true
leptos_axum.workspace = true
mybot-portal-web = { workspace = true, features = ["ssr"] }
mybot-portal-domain.workspace = true
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
hmac = "0.12"
sha1 = "0.10"
hex = "0.4"
base64 = "0.22"
tower-http = { version = "0.6", features = ["fs", "limit", "set-header"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }


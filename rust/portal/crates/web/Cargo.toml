[package]
name = "mybot-portal-web"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
ssr = ["leptos/ssr", "leptos_meta/ssr"]
hydrate = ["leptos/hydrate"]

[dependencies]
leptos.workspace = true
leptos_meta.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
mybot-portal-domain.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-net = "0.6"
gloo-timers = { version = "0.3", features = ["futures"] }
send_wrapper = "0.6"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Location", "History", "Storage", "File", "FileList", "FormData", "HtmlInputElement", "UrlSearchParams", "EventSource", "Event", "MessageEvent"] }

# ==============================================================================
# MyBot V4 Pure-Rust Engine — Linux Ubuntu 22.04 / 24.04 LTS Kernel Tuning
# Location: /etc/sysctl.d/99-mybot-sysctl.conf
# Apply:    sudo sysctl --system
# ==============================================================================

# Enable Google TCP BBR congestion control + fq packet scheduler for minimal
# Zalo WebSocket & CDN upload tail-latency across Vietnam <-> Singapore links
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# High-concurrency socket & ephemeral port headroom for 50-200 bot sessions
net.core.somaxconn = 65535
net.core.netdev_max_backlog = 32768
net.ipv4.tcp_max_syn_backlog = 16384
net.ipv4.ip_local_port_range = 10240 65535
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_fin_timeout = 15

# Aggressive TCP keepalive to detect dead NAT / Zalo WS drops within ~45s
net.ipv4.tcp_keepalive_time = 30
net.ipv4.tcp_keepalive_intvl = 5
net.ipv4.tcp_keepalive_probes = 3
net.ipv4.tcp_fastopen = 3

# Socket buffer ceilings (16 MiB) for 3MB chunked Zalo attachment uploads
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem = 4096 87380 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216

# Keep hot DashMap/SQLite mmap pages in RAM and raise file descriptor ceiling
vm.swappiness = 10
fs.file-max = 1048576
